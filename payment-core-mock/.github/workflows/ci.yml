name: NON_PRODUCTION | payment-core-mock

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CORE_MOCK_CLASSIFICATION: NON_PRODUCTION
  PAYMENT_CONTRACTS_REPOSITORY: ${{ vars.PAYMENT_CONTRACTS_REPOSITORY }}

jobs:
  boundary-gates:
    name: NON_PRODUCTION structural and build gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Require published contract repository
        run: test -n "$PAYMENT_CONTRACTS_REPOSITORY"
      - name: Documentation and structural gates
        run: |
          scripts/verify-docs.sh
          python3 -m unittest discover -s deploy -p 'test_*.py'
          docker compose --env-file .env.example -f compose.yaml config -q
      - name: Build standalone boundary
        env:
          PAYMENT_CONTRACTS_REPOSITORY_USERNAME: ${{ github.actor }}
          PAYMENT_CONTRACTS_REPOSITORY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon
