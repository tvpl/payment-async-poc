plugins {
    id 'io.micronaut.application'
}

group = 'com.example.payments'
version = '0.1.0'

def contractsRepository = providers.gradleProperty('contractsRepository')
        .orElse(providers.environmentVariable('PAYMENT_CONTRACTS_REPOSITORY'))
        .orElse(layout.projectDirectory.dir('../payment-contracts/build/repository').asFile.toURI().toString())
def contractsRepositoryUsername = providers.gradleProperty('contractsRepositoryUsername')
        .orElse(providers.environmentVariable('PAYMENT_CONTRACTS_REPOSITORY_USERNAME'))
def contractsRepositoryPassword = providers.gradleProperty('contractsRepositoryPassword')
        .orElse(providers.environmentVariable('PAYMENT_CONTRACTS_REPOSITORY_PASSWORD'))
def contractsVersion = providers.gradleProperty('contractsVersion').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('javaLanguageVersion').get().toInteger()
        )
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'paymentContracts'
                url = uri(contractsRepository.get())
                if (contractsRepositoryUsername.isPresent() && contractsRepositoryPassword.isPresent()) {
                    credentials {
                        username = contractsRepositoryUsername.get()
                        password = contractsRepositoryPassword.get()
                    }
                }
                metadataSources {
                    mavenPom()
                    artifact()
                }
            }
        }
        filter {
            includeGroup 'com.example.payments'
        }
    }
    mavenCentral()
}

micronaut {
    version = providers.gradleProperty('micronautVersion').get()
    runtime 'netty'
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'com.example.payments.coremock.*'
    }
}

dependencies {
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'

    // Trivy (SEC-08) flagged HIGH/CRITICAL CVEs on the Netty/Kafka-clients versions the
    // Micronaut BOM still pins as of micronautVersion above; force the fixed versions confirmed
    // resolvable on Maven Central rather than waiting on the next BOM release.
    implementation platform('io.netty:netty-bom:4.2.17.Final')
    implementation "org.apache.kafka:kafka-clients:3.9.2"

    implementation "com.example.payments:payment-contract-model:${contractsVersion}"
    implementation "com.example.payments:payment-contract-avro-apicurio:${contractsVersion}"
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    implementation 'io.micronaut.kafka:micronaut-kafka'
    implementation 'io.micronaut:micronaut-management'
    implementation 'io.micronaut.micrometer:micronaut-micrometer-registry-prometheus'
    implementation 'io.micronaut.tracing:micronaut-tracing-opentelemetry-kafka'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'jakarta.annotation:jakarta.annotation-api'

    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:7.4'
    runtimeOnly 'ch.qos.logback:logback-classic'
    runtimeOnly 'org.yaml:snakeyaml'

    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Trivy (SEC-08) flagged HIGH/CRITICAL CVEs (CVE-2026-33012, CVE-2026-44241,
// GHSA-387m-935m-c4vw) on micronaut-context/-http-client/-http-server as pinned by
// micronautVersion's own platform BOM (4.10.9 at bump time) — the platform aggregate release
// lags the individual modules' own patch cadence, which already has a 4.10.26 fix. Jackson
// 2.19.2 and Micrometer 1.15.4 have their own newer CVE fixes too (2.21.5, 1.16.6). Force these
// specific, verified-resolvable versions rather than waiting on the next platform BOM release.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.micronaut') {
            details.useVersion '4.10.26'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' &&
                (details.requested.name == 'jackson-core' || details.requested.name == 'jackson-databind')) {
            details.useVersion '2.21.5'
        }
        if (details.requested.group == 'io.micrometer') {
            details.useVersion '1.16.6'
        }
    }
}

application {
    mainClass = 'com.example.payments.coremock.Application'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Testcontainers 1.x defaults to Docker API 1.32, rejected by Docker 29+.
    // API 1.40 is supported by both the current Desktop daemon and older CI engines.
    systemProperty 'api.version', System.getProperty('api.version', '1.40')
    filter {
        setFailOnNoMatchingTests(false)
        if (!project.hasProperty('withIT')) {
            excludeTestsMatching '*IT'
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
