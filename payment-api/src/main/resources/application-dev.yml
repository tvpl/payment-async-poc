# Dev profile: no OTLP collector required locally (avoids periodic export errors).
# Activate with: MICRONAUT_ENVIRONMENTS=dev
otel:
  traces:
    exporter: none

# HS256 shared-secret signing/validation — dev/local only, so DevTokenController can mint tokens
# for manual v0 testing. Never present in production (see application-prod.yml, which validates
# asymmetric JWTs against the IdP's JWKS instead).
micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${API_DEV_JWT_SECRET}
              jws-algorithm: HS256
