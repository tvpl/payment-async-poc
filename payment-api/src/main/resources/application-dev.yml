# Dev profile: no OTLP collector required locally (avoids periodic export errors).
# Activate with: MICRONAUT_ENVIRONMENTS=dev
otel:
  traces:
    exporter: none

# HS256 shared-secret signing/validation — dev/local only, so DevTokenController can mint tokens
# for manual v0 testing. Never present in production (see application-prod.yml, which validates
# asymmetric JWTs against the IdP's JWKS instead).
micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SIGNATURE_SECRET}
              jws-algorithm: HS256

# SEC-05: HS256 secret shared with the SBUS's own dev signing config (SBUS_DEV_JWT_SECRET on
# both boundaries) - dev/local only, lets SbusServiceTokenProvider mint a ROLE_PAYMENT_API JWT
# for the durable status fallback call. Empty by default: unset means no credential is presented
# and the call degrades exactly like any other SBUS unavailability (SbusStatusGateway).
payment:
  sbus:
    credential:
      secret: ${SBUS_DEV_JWT_SECRET:}
