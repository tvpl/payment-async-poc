micronaut:
  application:
    name: payment-simulation-api
  server:
    port: 8080
  metrics:
    enabled: true
    binders:
      jvm:
        enabled: true
      kafka:
        enabled: true
    export:
      prometheus:
        enabled: true
        step: PT10S
        descriptions: true
  # The BLOCKING executor is backed by virtual threads on JDK 21+, so the POST
  # handler can park cheaply while waiting for the async result.
  http:
    services:
      # Durable status fallback. Best-effort by design, so its budget is explicit and small:
      # the GET path must not inherit an unbounded wait from a slow SBUS (PAY-09).
      sbus:
        url: ${SBUS_BASE_URL:`http://localhost:8081`}
        connect-timeout: 500ms
        read-timeout: 800ms
  security:
    # JWT is used only to identify the caller for feature/v0 gating. The business endpoint stays
    # anonymous at this layer (guarded instead by the X-API-Key filter) and v0 self-enforces from
    # the JWT via feature-control, so enabling security does not change the tested flow. Everything
    # else defaults to authenticated — the HS256 signing secret below is dev/test-only (see
    # application-dev.yml); production validates asymmetric JWTs only (application-prod.yml).
    authentication: bearer
    reject-not-found: false
    intercept-url-map:
      - pattern: /health/liveness
        access:
          - isAnonymous()
      - pattern: /health/readiness
        access:
          - isAnonymous()
      # Dev-only token issuer (excluded from the bean graph in prod; harmless allow here).
      - pattern: /auth/**
        access:
          - isAnonymous()
      # Runtime flag control requires the ROLE_ADMIN role from the JWT.
      - pattern: /admin/**
        access:
          - ROLE_ADMIN
      # Business endpoint: anonymous at this layer, enforced by ApiKeyFilter (X-API-Key).
      - pattern: /payment-simulations/**
        access:
          - isAnonymous()
      # v0 (beta): anonymous at this layer, self-enforced by the payment-api-v0 feature flag.
      - pattern: /v0/payment-simulations/**
        access:
          - isAnonymous()
      # Everything else (management endpoints, anything new) requires authentication by default.
      - pattern: /**
        access:
          - isAuthenticated()

# Feature control (shared lib). Baseline flags; Redis overrides them at runtime via /admin/features.
platform:
  features:
    redis-enabled: ${FEATURES_REDIS_ENABLED:true}
    cache-ttl: 5s
    key-prefix: "feature:"
    flags:
      # v0 API is restricted to the v0-testers group (recognized from the JWT).
      payment-api-v0:
        type: ALLOWLIST
        enabled: true
        allowed-groups:
          - v0-testers
        on-variant: v0
        off-variant: v1

payment:
  simulation:
    wait-timeout: 3s
    status-ttl: 15m
    idempotency-ttl: 15m
    response-channel: payment-sim-responses
    rate-limit:
      # Route budget, tenant budget, and the instance count that keeps the Redis-down
      # fallback from multiplying the approved burst across the fleet. Bound by
      # RateLimitProperties (@ConfigurationProperties("payment.simulation.rate-limit")) —
      # this block must stay under `simulation`, not `response-consumer`, or every key
      # here silently falls back to the Java defaults and PAYMENT_API_INSTANCES goes inert.
      limit-for-period: 200
      tenant-limit-for-period: 50
      instances: ${PAYMENT_API_INSTANCES:1}
      refresh-period: 1s
  response-consumer:
    # Bounded budget before a final event is dead-lettered. This blocks the partition on
    # purpose: ordering per requestId matters more than draining ahead of a stuck Redis.
    max-attempts: 3
    retry-delay: 500ms
  security:
    # API-key auth (PoC). Production: JWT/OAuth2 + mTLS. Override keys via env/secret.
    enabled: ${PAYMENT_SECURITY_ENABLED:true}
    api-keys:
      - ${PAYMENT_API_KEY}
  sbus:
    # Circuit for the durable status fallback: stop paying the read-timeout on every request
    # once the SBUS is consistently failing.
    failure-threshold: 5
    open-duration: 30s

redis:
  uri: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
  consumers:
    default:
      key:
        deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value:
        deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  producers:
    default:
      acks: all
      enable.idempotence: true
      key:
        serializer: org.apache.kafka.common.serialization.StringSerializer
      value:
        serializer: org.apache.kafka.common.serialization.ByteArraySerializer

apicurio:
  registry:
    url: ${APICURIO_REGISTRY_URL:`http://localhost:8085/apis/registry/v2`}

otel:
  service:
    name: payment-simulation-api
  traces:
    exporter: otlp
  metrics:
    exporter: none
  exporter:
    otlp:
      # Plain default avoids the colon being mis-parsed in a ${VAR:default} placeholder.
      # Override at runtime with env OTEL_EXPORTER_OTLP_ENDPOINT (Micronaut maps it here).
      endpoint: http://localhost:4317

endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false
    details-visible: NEVER
  prometheus:
    enabled: true
    sensitive: true
