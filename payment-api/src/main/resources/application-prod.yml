# Production security profile (MICRONAUT_ENVIRONMENTS=prod). Validates JWTs against the IdP's JWKS
# (RS256, key rotation handled by Micronaut) instead of the dev HS256 shared secret — which this
# profile never defines, so a token forged with a leaked/weak dev secret is never accepted here —
# and checks issuer, audience, expiration and not-before. Secrets/URLs come from the environment —
# never commit them. DevTokenController is excluded from this profile's bean graph entirely.
micronaut:
  security:
    token:
      jwt:
        signatures:
          jwks:
            idp:
              url: ${JWT_JWKS_URL}          # e.g. https://idp.example.com/.well-known/jwks.json
              key-type: RSA
        claims-validators:
          issuer: ${JWT_ISSUER}             # expected `iss`
          audience: ${JWT_AUDIENCE}         # expected `aud`
          expiration: true
          not-before: true

payment:
  security:
    clock-skew: 0s
  sbus:
    # SEC-05: a pre-minted token from external credential management, presented verbatim on the
    # durable status fallback call. Empty by default: unset means no credential is presented and
    # the call degrades exactly like any other SBUS unavailability (SbusStatusGateway).
    credential:
      token: ${SBUS_SERVICE_TOKEN:}

# SEC-01: schema governance is the registry's job, never inferred from a producer's payload.
# ProductionSecurityGuard fails boot if this is ever true in prod.
payments:
  avro:
    auto-register: false
