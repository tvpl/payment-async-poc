name: feature-control

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  JWT_SIGNATURE_SECRET: ci-only-signing-value-with-at-least-32-bytes

jobs:
  release-gates:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and build
        run: ./gradlew test --no-daemon && ./gradlew build --no-daemon
      - name: Integration
        run: ./gradlew test -PwithIT --no-daemon
      - name: Documentation
        run: scripts/verify-docs.sh
      - name: Consumer fixture (publication, API compatibility, artifact-only)
        run: bash scripts/verify-consumer-fixture.sh
      - name: Hygiene
        run: git diff --check
