// Standalone root for the feature-control boundary: the published library plus its two
// NON_PRODUCTION examples (feature-demo, pilot-app). The root itself is not a source project —
// it only aggregates the shared Test/compile conventions and a few publication-verification tasks.
plugins {
    id 'base'
}

group = 'com.example.platform'
version = '0.1.0'

subprojects {
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Integration tests (*IT) need a real Redis and are excluded by default so the quick
        // gate (`test`) stays fast; the full gate opts in with -PwithIT (same convention as the
        // transitional workspace root this boundary was extracted from).
        filter {
            setFailOnNoMatchingTests(false)
            if (!project.hasProperty('withIT')) {
                excludeTestsMatching '*IT'
            }
        }
        testLogging {
            events 'passed', 'skipped', 'failed'
            exceptionFormat 'full'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }
}

tasks.register('publishLibraryToLocalBuildRepository') {
    group = 'publishing'
    description = 'Publishes the feature-control library to its boundary-local Maven repository.'
    dependsOn ':feature-control:publishMavenPublicationToLocalBuildRepository'
}

tasks.register('verifyLocalPublication') {
    group = 'verification'
    description = 'Verifies POM, binary, sources and Javadoc for the published feature-control artifact.'
    dependsOn tasks.named('publishLibraryToLocalBuildRepository')

    doLast {
        def repository = layout.buildDirectory.dir('repo').get().asFile
        def artifactDirectory = new File(repository, "com/example/platform/feature-control/${project(':feature-control').version}")
        def prefix = "feature-control-${project(':feature-control').version}"
        [
            "${prefix}.pom",
            "${prefix}.jar",
            "${prefix}-sources.jar",
            "${prefix}-javadoc.jar"
        ].each { artifact ->
            if (!new File(artifactDirectory, artifact).isFile()) {
                throw new GradleException("Missing published artifact: ${artifactDirectory}/${artifact}")
            }
        }
    }
}
