name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  PAYMENT_API_KEY: ci-only-required-value
  JWT_SIGNATURE_SECRET: ci-only-signing-value-with-at-least-32-bytes
  POSTGRES_PASSWORD: ci-only-required-value
  GRAFANA_ADMIN_PASSWORD: ci-only-required-value
  COVERAGE_GATE_STATUS: NOT_RUN

jobs:
  boundary-build:
    name: Build / ${{ matrix.boundary }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boundary: payment-contracts
            command: cd payment-contracts && ./gradlew build --no-daemon
          - boundary: payment-api
            command: cd payment-api && ./gradlew build --no-daemon
          - boundary: payment-sbus
            command: cd payment-sbus && ./gradlew build --no-daemon
          - boundary: payment-core-mock
            command: cd payment-core-mock && ./gradlew build --no-daemon
          - boundary: feature-control
            command: cd feature-control && ./gradlew build --no-daemon
          - boundary: async-redis-service
            command: cd async-redis-service && ./gradlew build --no-daemon
          - boundary: sandbox
            command: cd sandbox && make config
          - boundary: gateway
            command: cd gateway && make config
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        if: ${{ !contains(fromJSON('["sandbox","gateway"]'), matrix.boundary) }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        if: ${{ !contains(fromJSON('["sandbox","gateway"]'), matrix.boundary) }}
        uses: gradle/actions/setup-gradle@v4
      # Cross-boundary deps resolve by GAV from a sibling boundary's build output, which a fresh
      # checkout does not have (build/ is gitignored). Without this, payment-api/payment-sbus/
      # payment-core-mock fail on "Could not find com.example.payments:payment-contract-model".
      - name: Publish prerequisite artifacts
        if: contains(fromJSON('["payment-api","payment-sbus","payment-core-mock"]'), matrix.boundary)
        run: |
          (cd payment-contracts && ./gradlew publishAllToLocalBuildRepository --no-daemon)
          if [ "${{ matrix.boundary }}" = "payment-api" ]; then
            (cd feature-control && ./gradlew publishLibraryToLocalBuildRepository --no-daemon)
          fi
      - name: Run boundary build
        id: gate
        env:
          CI_GATE_COMMAND: ${{ matrix.command }}
        shell: bash
        run: |
          set +e
          bash -lc "$CI_GATE_COMMAND"
          gate_exit=$?
          set -e
          if [ "$gate_exit" -eq 0 ]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
      - name: Record boundary result
        if: always()
        run: echo "| ${{ matrix.boundary }} | ${{ steps.gate.outputs.result || 'NOT_RUN' }} |" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce boundary result
        if: always()
        env:
          CI_GATE_RESULT: ${{ steps.gate.outputs.result || 'NOT_RUN' }}
        run: test "$CI_GATE_RESULT" = PASS
      - name: Upload test reports
        if: ${{ always() && !contains(fromJSON('["sandbox","gateway"]'), matrix.boundary) }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-${{ matrix.boundary }}
          path: "**/build/reports/tests/**"
          if-no-files-found: warn

  integration:
    name: Integration / ${{ matrix.boundary }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - boundary: payment-api
            command: cd payment-api && ./gradlew test -PwithIT --no-daemon
          - boundary: payment-sbus
            command: cd payment-sbus && ./gradlew test -PwithIT --no-daemon
          - boundary: async-redis-service
            command: cd async-redis-service && ./gradlew test -PwithIT --no-daemon
          - boundary: feature-control
            command: cd feature-control && ./gradlew test -PwithIT --no-daemon
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish prerequisite artifacts
        if: contains(fromJSON('["payment-api","payment-sbus"]'), matrix.boundary)
        run: |
          (cd payment-contracts && ./gradlew publishAllToLocalBuildRepository --no-daemon)
          if [ "${{ matrix.boundary }}" = "payment-api" ]; then
            (cd feature-control && ./gradlew publishLibraryToLocalBuildRepository --no-daemon)
          fi
      - name: Run required integration gate
        id: integration-gate
        env:
          CI_GATE_COMMAND: ${{ matrix.command }}
          REDIS_TEST_URI: redis://localhost:6379
        shell: bash
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "result=NOT_RUN" >> "$GITHUB_OUTPUT"
            echo "reason=Docker unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          bash -lc "$CI_GATE_COMMAND"
          gate_exit=$?
          set -e
          if [ "$gate_exit" -eq 0 ]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          fi
      - name: Record integration result
        if: always()
        run: echo "| ${{ matrix.boundary }} IT | ${{ steps.integration-gate.outputs.result || 'NOT_RUN' }} | ${{ steps.integration-gate.outputs.reason }} |" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce integration result
        if: always()
        env:
          CI_GATE_RESULT: ${{ steps.integration-gate.outputs.result || 'NOT_RUN' }}
        run: test "$CI_GATE_RESULT" = PASS
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.boundary }}
          path: "**/build/reports/tests/**"
          if-no-files-found: error

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Structural CI policy
        run: python3 .github/workflows/check_ci_policy.py

  static-analysis:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile every standalone root for CodeQL
        run: |
          # Publish first: the consumer roots resolve contracts/feature-control by GAV from a
          # sibling build/ directory that a fresh checkout does not have.
          (cd payment-contracts && ./gradlew publishAllToLocalBuildRepository --no-daemon)
          (cd feature-control && ./gradlew publishLibraryToLocalBuildRepository --no-daemon)
          for boundary in payment-contracts payment-api payment-sbus payment-core-mock feature-control async-redis-service; do
            (cd "$boundary" && ./gradlew classes --no-daemon)
          done
      - uses: github/codeql-action/analyze@v3

  governance:
    name: Governance and explicit gate status
    runs-on: ubuntu-latest
    needs: [boundary-build, integration, workflow-lint, static-analysis]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository policies
        run: |
          python3 scripts/workspace/check_root_governance.py
          python3 scripts/security/check_repository_secrets.py
          python3 .github/workflows/check_ci_policy.py
      - name: Record quality policy
        run: |
          {
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| workflow lint | ${{ needs.workflow-lint.result == 'success' && 'PASS' || 'FAIL' }} |"
            echo "| static analysis | ${{ needs.static-analysis.result == 'success' && 'PASS' || 'FAIL' }} |"
            echo "| coverage | ${COVERAGE_GATE_STATUS} |"
            echo "| dependency updates | PASS |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce executed blocking gates
        env:
          BOUNDARY_RESULT: ${{ needs.boundary-build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          LINT_RESULT: ${{ needs.workflow-lint.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
        run: |
          test "$BOUNDARY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$LINT_RESULT" = success
          test "$STATIC_RESULT" = success
