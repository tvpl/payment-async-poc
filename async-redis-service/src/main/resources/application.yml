micronaut:
  application:
    name: async-redis-service
  server:
    port: 8084
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        step: PT10S

redis:
  uri: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}

# Kafka-free async->sync via Redis Streams (queue) + BRPOP (per-request wakeup).
async:
  redis:
    # Max time the POST blocks (on a virtual thread) waiting for the released response.
    wait-timeout: 3s
    # TTL of the durable result and the per-request response list (avoids key leaks).
    result-ttl: 15m
    # How long an accepted job stays answerable. The window between this and result-ttl is what
    # makes an expired result distinguishable from a job that never existed. Must be >= result-ttl.
    status-ttl: 24h
    # How long an Idempotency-Key stays bound to its job.
    idempotency-ttl: 24h
    # Whether POST /jobs rejects a submission with no Idempotency-Key. Required in production.
    idempotency-required: false
    # X-API-Key authentication for the job endpoints. Production refuses the development default.
    # Override per environment with ASYNC_REDIS_SECURITY_ENABLED / ASYNC_REDIS_SECURITY_API_KEYS.
    security:
      enabled: true
      api-keys:
        - dev-key-change-me
    # Number of worker consumers pulling from the stream (each holds one blocking connection).
    worker-concurrency: 2
    # Stream + consumer group names.
    stream: async.jobs
    group: workers
    # Simulated processing time so the demo/benchmark exercises real waiting.
    process-latency-min-ms: ${ASYNC_LATENCY_MIN_MS:20}
    process-latency-max-ms: ${ASYNC_LATENCY_MAX_MS:150}
    # Identity of this process inside the consumer group. Derived per process when unset, which is
    # what keeps two replicas of the same image from sharing a consumer name (and its PEL).
    instance-id: ${ASYNC_INSTANCE_ID:}
    # Reclaim messages idle longer than this from crashed consumers.
    reclaim-idle: 30s
    # How often each worker scans pending entries for reclaim/DLQ.
    reclaim-interval: 5s
    # How long the single reclaim turn stays owned. Must exceed reclaim-interval so the owner can
    # renew before it lapses; a crashed owner frees the turn when it expires.
    reclaim-lease: 10s
    # Reconnect backoff for a worker whose Redis is unreachable at startup or lost mid-loop.
    # A connection that survives longer than the ceiling resets the delay back to the floor.
    connect-backoff-min: 200ms
    connect-backoff-max: 5s
    # Backlog budget the retention monitor alerts against (retention-alert-threshold * this value).
    # No longer used to trim the stream inline - see StreamRetentionMonitor (RED-03).
    stream-maxlen: ${ASYNC_STREAM_MAXLEN:100000}
    # Fraction of stream-maxlen at which the backlog alert fires.
    retention-alert-threshold: ${ASYNC_RETENTION_ALERT_THRESHOLD:0.8}
    # Poison protection: after this many deliveries a job is moved to the DLQ.
    dlq-stream: async.jobs.dlq
    max-deliveries: ${ASYNC_MAX_DELIVERIES:5}
    # Admission rate limit for POST /jobs (per second, global via Redis). 0 disables it.
    admission-limit-per-sec: ${ASYNC_ADMISSION_LIMIT:0}
    # Max pooled connections for concurrent blocking BRPOP waits.
    pool-max-total: ${ASYNC_POOL_MAX_TOTAL:64}

endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    enabled: true
    details-visible: ANONYMOUS
  prometheus:
    enabled: true
    sensitive: false
