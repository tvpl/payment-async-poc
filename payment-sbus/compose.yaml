name: payment-sbus

services:
  sbus:
    image: payment-sbus:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        contracts-repository: ${PAYMENT_CONTRACTS_REPOSITORY_CONTEXT:-../payment-contracts/build/repository}
    environment:
      MICRONAUT_ENVIRONMENTS: ${MICRONAUT_ENVIRONMENTS:-dev}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      APICURIO_REGISTRY_URL: ${APICURIO_REGISTRY_URL:-http://registry:8080/apis/registry/v2}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
      POSTGRES_JDBC_URL: ${POSTGRES_JDBC_URL:-jdbc:postgresql://postgres:5432/sbus}
      POSTGRES_USER: ${POSTGRES_USER:-sbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      SBUS_JWT_JWKS_URL: ${SBUS_JWT_JWKS_URL:-}
      SBUS_JWT_ISSUER: ${SBUS_JWT_ISSUER:-}
      SBUS_JWT_AUDIENCE: ${SBUS_JWT_AUDIENCE:-}
    ports:
      - "${SBUS_HOST_PORT:-8081}:8081"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: unless-stopped
    networks:
      - sandbox

networks:
  sandbox:
    external: true
    name: ${SANDBOX_NETWORK:-payment-sandbox}
