micronaut:
  application:
    name: payment-sbus
  server:
    port: 8081
  security:
    authentication: bearer
    reject-not-found: false
    intercept-url-map:
      - pattern: /health/liveness
        access:
          - isAnonymous()
      - pattern: /health/readiness
        access:
          - isAnonymous()
      - pattern: /internal/**
        access:
          - ROLE_PAYMENT_API
      - pattern: /**
        access:
          - isAuthenticated()
  metrics:
    enabled: true
    binders:
      jvm:
        enabled: true
      kafka:
        enabled: true
    export:
      prometheus:
        enabled: true
        step: PT10S
        descriptions: true

kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:`localhost:9092`}
  # The built-in "kafka" readiness indicator is superseded by health/KafkaHealthIndicator
  # (AUD-09), which reads the declared sbus.dependencies.kafka budget; the built-in one does not.
  health:
    enabled: false
  consumers:
    default:
      key:
        deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Avro bytes are decoded explicitly via AvroSerde so we keep control over
      # poison messages (route them to the DLQ) instead of failing in the deserializer.
      value:
        deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max:
        poll:
          records: 100
          interval:
            # AUD-10: unset before, defaulting to Kafka's own 5-minute default — far below the
            # 30-minute retry budget (retryCount=900 x retryDelay=2s, see PaymentRequestedConsumer
            # / CoreResponseConsumer) a durable-persistence retry loop needs to ride out a
            # realistic Postgres failover. Below the budget, the consumer group would evict the
            # instance for exceeding max.poll.interval.ms long before the retries exhaust. 35
            # minutes clears the 30-minute budget with margin.
            ms: 2100000
  producers:
    default:
      key:
        serializer: org.apache.kafka.common.serialization.StringSerializer
      value:
        serializer: org.apache.kafka.common.serialization.ByteArraySerializer

# Apicurio Schema Registry (Confluent serdes are not available on Maven Central here).
apicurio:
  registry:
    url: ${APICURIO_REGISTRY_URL:`http://localhost:8085/apis/registry/v2`}

payments:
  avro:
    registry-url: ${apicurio.registry.url}
    codec-pool-size: 8
    codec-acquire-timeout: 250ms
    auto-register: true

# Redis is used only for the distributed (global) core-command rate limiter.
redis:
  uri: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
  # The built-in "redis" readiness indicator is superseded by health/RedisHealthIndicator
  # (AUD-09), which reads the declared sbus.dependencies.redis budget; the built-in one does not.
  health:
    enabled: false

datasources:
  default:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sbus}?stringtype=unspecified
    username: ${POSTGRES_USER:sbus}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    dialect: POSTGRES
    schema-generate: NONE
    maximum-pool-size: 10

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration

sbus:
  outbox:
    batch-size: 100
    max-attempts: 8
    base-backoff: 2s
    max-backoff: 5m
    publish-timeout: 30s
    poll-interval: 200ms
    initial-delay: 3s
    lease: 1m
    retention: 3d
  core:
    # Throughput guard protecting the (slower) Core from request bursts.
    limit-for-period: 50
    refresh-period: 1s
  retry:
    max-attempts: 5
    base-delay: 1s
    max-delay: 30s
  housekeeping:
    idempotency-retention: 7d
    message-retention: 30d
    batch-size: 500
    interval: 1h
  retention:
    kafka-topic: 7d
    max-redelivery-window: 1d
  dependencies:
    kafka:
      timeout: 30s
      max-attempts: 8
      readiness-required: true
    postgresql:
      timeout: 3s
      max-attempts: 3
      readiness-required: true
    redis:
      timeout: 2s
      max-attempts: 1
      # RES-03/RES-04: Redis backs only the Core rate limiter; an outage degrades throttling
      # but does not stop payment durability, so it no longer gates readiness (see
      # RedisHealthIndicator, which still reports it as degraded).
      readiness-required: false
    registry:
      timeout: 3s
      max-attempts: 3
      readiness-required: true

otel:
  service:
    name: payment-sbus
  traces:
    exporter: otlp
  metrics:
    exporter: none
  exporter:
    otlp:
      # Plain default avoids the colon being mis-parsed in a ${VAR:default} placeholder.
      # Override at runtime with env OTEL_EXPORTER_OTLP_ENDPOINT (Micronaut maps it here).
      endpoint: http://localhost:4317

endpoints:
  all:
    enabled: false
  health:
    enabled: true
    sensitive: false
    details-visible: NEVER
    # Superseded by the "postgresql" indicator (health/PostgresHealthIndicator, AUD-09), which
    # reads the declared sbus.dependencies.postgresql budget. The built-in indicator's own
    # connection acquisition has no such bound (HikariCP's connectionTimeout defaults to 30s),
    # so a stale pooled connection during a real outage can hold up readiness far longer than any
    # declared budget.
    jdbc:
      enabled: false
  prometheus:
    enabled: true
    sensitive: true
