plugins {
    id 'io.micronaut.application'
}

group = 'com.example.payments'
version = '0.1.0'

def contractsRepository = providers.gradleProperty('contractsRepository')
        .orElse(providers.environmentVariable('PAYMENT_CONTRACTS_REPOSITORY'))
        .orElse(layout.projectDirectory.dir('../payment-contracts/build/repository').asFile.toURI().toString())
def contractsRepositoryUsername = providers.gradleProperty('contractsRepositoryUsername')
        .orElse(providers.environmentVariable('PAYMENT_CONTRACTS_REPOSITORY_USERNAME'))
def contractsRepositoryPassword = providers.gradleProperty('contractsRepositoryPassword')
        .orElse(providers.environmentVariable('PAYMENT_CONTRACTS_REPOSITORY_PASSWORD'))
def contractsVersion = providers.gradleProperty('contractsVersion').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                providers.gradleProperty('javaLanguageVersion').get().toInteger()
        )
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'paymentContracts'
                url = uri(contractsRepository.get())
                if (contractsRepositoryUsername.isPresent() && contractsRepositoryPassword.isPresent()) {
                    credentials {
                        username = contractsRepositoryUsername.get()
                        password = contractsRepositoryPassword.get()
                    }
                }
                metadataSources {
                    mavenPom()
                    artifact()
                }
            }
        }
        filter {
            includeGroup 'com.example.payments'
        }
    }
    mavenCentral()
}

micronaut {
    version = providers.gradleProperty('micronautVersion').get()
    runtime 'netty'
    testRuntime 'junit5'
    processing {
        incremental true
        annotations 'com.example.payments.sbus.*'
    }
}

dependencies {
    annotationProcessor 'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor 'io.micronaut.data:micronaut-data-processor'
    annotationProcessor 'io.micronaut:micronaut-http-validation'
    annotationProcessor 'io.micronaut.security:micronaut-security-annotations'

    constraints {
        // micronaut-platform's kafka.version (3.9.1) predates the fix for the HIGH kafka-clients
        // CVEs Trivy flags; force the transitive kafka-clients pulled in by micronaut-kafka.
        implementation('org.apache.kafka:kafka-clients:3.9.2')
        // micronaut-platform's micrometer.version (1.15.4) predates the fix for the HIGH
        // micrometer-core CVEs Trivy flags; force the transitive dependency.
        implementation('io.micrometer:micrometer-core:1.15.12')
    }

    implementation "com.example.payments:payment-contract-model:${contractsVersion}"
    implementation "com.example.payments:payment-contract-avro-apicurio:${contractsVersion}"
    implementation 'io.micronaut.serde:micronaut-serde-jackson'
    implementation 'io.micronaut.kafka:micronaut-kafka'
    implementation 'io.micronaut.data:micronaut-data-jdbc'
    implementation 'io.micronaut.sql:micronaut-jdbc-hikari'
    implementation 'io.micronaut.flyway:micronaut-flyway'
    implementation 'io.micronaut.redis:micronaut-redis-lettuce'
    implementation 'io.micronaut.security:micronaut-security-jwt'
    implementation 'io.micronaut:micronaut-management'
    implementation 'io.micronaut.micrometer:micronaut-micrometer-registry-prometheus'
    implementation 'io.micronaut.tracing:micronaut-tracing-opentelemetry-http'
    implementation 'io.micronaut.tracing:micronaut-tracing-opentelemetry-kafka'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'jakarta.annotation:jakarta.annotation-api'

    // micronaut-platform's postgres.driver.version (42.7.8) predates the fix for the HIGH
    // org.postgresql:postgresql CVE Trivy flags.
    runtimeOnly 'org.postgresql:postgresql:42.7.12'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'net.logstash.logback:logstash-logback-encoder:7.4'
    runtimeOnly 'ch.qos.logback:logback-classic'
    runtimeOnly 'org.yaml:snakeyaml'

    testImplementation 'io.micronaut.test:micronaut-test-junit5'
    testImplementation 'io.micronaut:micronaut-http-client'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.4')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'com.redis:testcontainers-redis:2.2.2'
    testImplementation 'org.awaitility:awaitility:4.2.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.example.payments.sbus.Application'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'api.version', System.getProperty('api.version', '1.40')
    filter {
        setFailOnNoMatchingTests(false)
        if (!project.hasProperty('withIT')) {
            excludeTestsMatching '*IT'
        }
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}
