# Equivalente aos blocos "access_log" (StdoutAccessLog + json_format) e "tracing"
# (OpenTelemetry) do envoy.yaml. Os mesmos campos do log JSON, referenciado pelo
# Gateway em gateway.yaml (spec.infrastructure.parametersRef).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: payment-gateway-proxy-config
spec:
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              request_id: "%REQ(X-REQUEST-ID)%"
              client_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
              user_agent: "%REQ(USER-AGENT)%"
              jwt_subject: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:jwt_payload:sub)%"
              route: "%ROUTE_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    tracing:
      samplingRate: 100
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: otel-collector
            port: 4317
