global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Application-owned alert rules, mounted (not copied — sandbox/docs/observability.md) from each
# app's own ops/alerts/*.yml per sandbox/observability/application-assets.json's manifest; see
# sandbox/compose.profiles.yml's prometheus volumes for the actual mounts.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: redis-exporter
    static_configs:
      - targets: [redis-exporter:9121]

  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: kafka-exporter
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: application-owned
    # Micronaut's Prometheus endpoint is /prometheus, not the Prometheus-client-default
    # /metrics — every app in this workspace uses this same convention (see each app's
    # application.yml `endpoints.prometheus`).
    metrics_path: /prometheus
    file_sd_configs:
      - files: [/etc/prometheus/application-targets.json]
        refresh_interval: 10s
